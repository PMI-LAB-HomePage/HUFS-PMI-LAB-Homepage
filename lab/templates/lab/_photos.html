{% load lab %}{# 사진 한 줄 (갤러리·수상·소식). 칸 크기는 tile 클래스로 정한다. 누르면 라이트박스로 원본 #}
<div class="photo-stack">
  {% for p in photos %}
    <a class="media {{ tile }}" href="{{ p.image.url }}" data-lightbox="{{ prefix }}{{ group }}"><img src="{{ p.image.url }}" alt="{{ alt|default:'' }}" loading="lazy"></a>
  {% endfor %}
</div>
