{% load lab %}{# 이미지·영상 한 줄 (연구·모집). 칸 크기는 tile 클래스로 정한다 #}
<div class="photo-stack">
  {% for m in media %}
    {% if m.kind == "video" %}
      <div class="media {{ tile }}"><video src="{{ m.file.url }}" controls preload="metadata"></video></div>
    {% else %}
      <a class="media {{ tile }}" href="{{ m.file.url }}" data-lightbox="{{ prefix }}{{ group }}"><img src="{{ m.file.url }}" alt="" loading="lazy"></a>
    {% endif %}
  {% endfor %}
</div>
