# PMI Lab 홈페이지 — 운영 구성
#   방문자 → caddy(80·443, HTTPS 자동) → web(gunicorn:8000) → SQLite 파일
#
#   docker compose up -d --build
#
# 데이터는 전부 ./data 안에 있다. 백업은 이 폴더를 복사하면 끝난다(deploy/backup.sh).
# 프로젝트 이름을 고정한다. 안 적으면 폴더 이름에서 만들어지는데,
# 폴더에 한글이나 특수문자가 있으면 "invalid reference format"으로 기동이 실패한다.
name: pmilab

services:
  web:
    build: .
    env_file: .env
    environment:
      # 코드(이미지)와 데이터(볼륨)를 분리한다. 이 경로들이 ./data로 나간다
      SQLITE_PATH: /data/db.sqlite3
      MEDIA_ROOT: /data/media
    volumes:
      - ./data:/data                 # SQLite + 업로드 파일. 이 폴더만 백업하면 된다
      - static:/app/staticfiles      # collectstatic 결과를 caddy가 읽는다
    expose:
      - "8000"                       # 호스트에 열지 않는다. caddy만 접근
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"                      # 인증서 발급·갱신 검증이 80으로 들어온다. 닫으면 안 된다
      - "443:443"
      - "443:443/udp"                # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - ./data/media:/srv/media:ro
      - caddy_data:/data             # 발급받은 인증서. 지우면 재발급 한도에 걸릴 수 있다
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  static:
  caddy_data:
  caddy_config:
